name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-22.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev

      - name: Version
        id: ver
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p out
          for bin in gplauncher gplauncher-gui; do
            lipo -create -output "out/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
          done

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release
          mkdir -p out
          cp target/release/gplauncher* out/ 2>/dev/null || true
          rm -f out/*.d out/*.pdb

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          APP="out/gpLauncher.app"
          mkdir -p "$APP/Contents/MacOS"
          cp out/gplauncher-gui out/gplauncher "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>gplauncher-gui</string>
              <key>CFBundleName</key><string>gpLauncher</string>
              <key>CFBundleIdentifier</key><string>dev.gplauncher</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature so Apple Silicon runs the universal binary.
          codesign --force --deep --sign - "$APP"
          (cd out && ditto -c -k --keepParent gpLauncher.app "../gplauncher-$VERSION-${{ matrix.name }}.zip")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/*.exe -DestinationPath "gplauncher-${{ steps.ver.outputs.tag }}-${{ matrix.name }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "gplauncher-${{ steps.ver.outputs.tag }}-${{ matrix.name }}.tar.gz" -C out gplauncher gplauncher-gui

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: gplauncher-*.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
