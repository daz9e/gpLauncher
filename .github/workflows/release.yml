name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-22.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev

      - name: Version
        id: ver
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --bin gplauncher-gui --target aarch64-apple-darwin
          cargo build --release --bin gplauncher-gui --target x86_64-apple-darwin
          mkdir -p out
          lipo -create -output out/gplauncher-gui \
            target/aarch64-apple-darwin/release/gplauncher-gui \
            target/x86_64-apple-darwin/release/gplauncher-gui

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release --bin gplauncher-gui
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/gplauncher-gui.exe out/gpLauncher.exe
          else
            cp target/release/gplauncher-gui out/gplauncher
          fi

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          BASE="gplauncher-$VERSION-${{ matrix.name }}"
          APP="out/gpLauncher.app"
          mkdir -p "$APP/Contents/MacOS"
          cp out/gplauncher-gui "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>gplauncher-gui</string>
              <key>CFBundleName</key><string>gpLauncher</string>
              <key>CFBundleIdentifier</key><string>dev.gplauncher</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature so Apple Silicon runs the universal binary.
          codesign --force --deep --sign - "$APP"

          # Installer: disk image with the usual drag-to-Applications layout.
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname gpLauncher -srcfolder dmg -format UDZO -ov "$BASE.dmg"

          # Portable: the app plus the marker that keeps data next to it.
          mkdir -p portable/gpLauncher
          cp -R "$APP" portable/gpLauncher/
          echo "Keeps launcher data in the data folder next to gpLauncher." > portable/gpLauncher/portable.txt
          (cd portable && ditto -c -k --keepParent gpLauncher "../$BASE-portable.zip")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.tag }}"
          $base = "gplauncher-$version-${{ matrix.name }}"

          # Installer.
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /Q "/DAppVersion=$($version.TrimStart('v'))" "/DBinDir=$PWD\out" "/DOutputName=$base-setup" "/O$PWD" packaging\windows\gplauncher.iss

          # Portable: the exe plus the marker that keeps data next to it.
          New-Item -ItemType Directory -Force portable\gpLauncher | Out-Null
          Copy-Item out\gpLauncher.exe portable\gpLauncher\
          Set-Content portable\gpLauncher\portable.txt "Keeps launcher data in the data folder next to gpLauncher.exe."
          Compress-Archive -Path portable\gpLauncher -DestinationPath "$base-portable.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "gplauncher-${{ steps.ver.outputs.tag }}-${{ matrix.name }}.tar.gz" -C out gplauncher

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: gplauncher-*.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
