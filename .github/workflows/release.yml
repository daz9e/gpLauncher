name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-universal
          - os: windows-latest
            name: windows-x86_64
          - os: ubuntu-22.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Test
        shell: bash
        run: |
          npm test --prefix ui
          npm run check --prefix ui
          cargo test --workspace

      - name: Version
        id: ver
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          # Stamp the tag's version into the app; manual runs keep the one from src-tauri/Cargo.toml.
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "config={\"version\":\"${GITHUB_REF_NAME#v}\"}" >> "$GITHUB_OUTPUT"
          else
            echo "config={}" >> "$GITHUB_OUTPUT"
          fi

      # `tauri build` builds the UI (ui/dist) and embeds it into the binary.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          TAURI_CONFIG: ${{ steps.ver.outputs.config }}
        run: |
          ui/node_modules/.bin/tauri build --config "$TAURI_CONFIG" --target universal-apple-darwin --bundles app
          mkdir -p out
          cp -R target/universal-apple-darwin/release/bundle/macos/gpLauncher.app out/

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        shell: bash
        env:
          TAURI_CONFIG: ${{ steps.ver.outputs.config }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            ui/node_modules/.bin/tauri build --config "$TAURI_CONFIG" --no-bundle
            mkdir -p out
            cp target/release/gplauncher-gui.exe out/gpLauncher.exe
          else
            ui/node_modules/.bin/tauri build --config "$TAURI_CONFIG" --bundles deb,appimage
            mkdir -p out
            cp target/release/gplauncher-gui out/gplauncher
          fi

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          BASE="gplauncher-$VERSION-${{ matrix.name }}"
          APP="out/gpLauncher.app"
          # Ad-hoc signature so Apple Silicon runs the universal binary.
          codesign --force --deep --sign - "$APP"

          # Installer: disk image with the usual drag-to-Applications layout.
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname gpLauncher -srcfolder dmg -format UDZO -ov "$BASE.dmg"

          # Portable: the app plus the marker that keeps data next to it.
          mkdir -p portable/gpLauncher
          cp -R "$APP" portable/gpLauncher/
          echo "Keeps launcher data in the data folder next to gpLauncher." > portable/gpLauncher/portable.txt
          (cd portable && ditto -c -k --keepParent gpLauncher "../$BASE-portable.zip")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.tag }}"
          $base = "gplauncher-$version-${{ matrix.name }}"

          # Installer.
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /Q "/DAppVersion=$($version.TrimStart('v'))" "/DBinDir=$PWD\out" "/DOutputName=$base-setup" "/O$PWD" packaging\windows\gplauncher.iss

          # Portable: the exe plus the marker that keeps data next to it.
          New-Item -ItemType Directory -Force portable\gpLauncher | Out-Null
          Copy-Item out\gpLauncher.exe portable\gpLauncher\
          Set-Content portable\gpLauncher\portable.txt "Keeps launcher data in the data folder next to gpLauncher.exe."
          Compress-Archive -Path portable\gpLauncher -DestinationPath "$base-portable.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          BASE="gplauncher-${{ steps.ver.outputs.tag }}-${{ matrix.name }}"
          tar -czf "$BASE.tar.gz" -C out gplauncher
          cp target/release/bundle/deb/*.deb "$BASE.deb"
          cp target/release/bundle/appimage/*.AppImage "$BASE.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: gplauncher-*.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
