[package]
name = "gplauncher"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Minecraft: Java Edition launcher core: versions, mod loaders, Java runtimes, accounts and modpack import"
keywords = ["minecraft", "launcher", "fabric", "modrinth"]
categories = ["games", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
futures = "0.3"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# Already built for gpui; used to shrink modpack icons.
image = "0.25"
md-5 = "0.11"
flate2 = "1"
toml = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
ureq = { version = "3.4.2", features = ["json"] }
uuid = { version = "1.26.1", features = ["v3"] }
zip = "8.6.0"

# gpui is far too slow to render without optimizations; our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "gplauncher-gui"
path = "src/gui/main.rs"
